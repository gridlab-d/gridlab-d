# .github/workflows/ci-linux-matrix.yml
name: CI – Linux (ARM64 + x86_64) with Python validator

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      config:
        description: "CMake build type"
        required: false
        default: "Release"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-validate:
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: ubuntu-arm64
            runs-on: ubuntu-24.04-arm64   # ARM64 native hosted runner
            triplet: aarch64
          - name: ubuntu-x64
            runs-on: ubuntu-latest        # x86_64 runner
            triplet: x86_64

    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runs-on }}
    timeout-minutes: 60
    env:
      BUILD_TYPE:     ${{ github.event.inputs.config || 'Release' }}
      INSTALL_PREFIX: ${{ github.workspace }}/.local/GridLAB-D

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: System diagnostics
        run: |
          set -x
          uname -a
          arch
          nproc
          free -h || true
          df -h .
          gcc --version | head -1 || true
          cmake --version | head -1 || true
          ninja --version || true
          echo "── git info ──"
          git log --oneline -3

      - name: Install build dependencies
        run: |
          set -euxo pipefail
          sudo apt-get update -yq
          sudo apt-get install -yq --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            pkg-config \
            libboost-dev \
            libeigen3-dev
          cmake --version | head -1
          ninja --version

      - name: Configure (CMake + Ninja)
        run: |
          cmake -S . -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} \
            -DCMAKE_INSTALL_PREFIX=${{ env.INSTALL_PREFIX }} \
            -DGLD_CI_BUILD=ON

      - name: Build GridLAB-D
        run: |
          cmake --build build --parallel $(nproc) --verbose

      - name: Install GridLAB-D
        run: |
          cmake --install build --verbose
          echo "─── installed tree (first 100 entries) ───"
          find "$INSTALL_PREFIX" -type f | head -100

      # ─────────────────────────────────────────────
      # Python-based validation replaces gridlabd --validate
      # ─────────────────────────────────────────────
      - name: Install Python 3 + pip
        run: |
          sudo apt-get update -yq
          sudo apt-get install -yq python3 python3-pip

      - name: Install validator dependencies (optional)
        if: ${{ hashFiles('tools/validate/requirements.txt') != '' }}
        run: |
          pip3 install -r tools/validate/requirements.txt

      - name: Run Python GridLAB-D validator
        run: |
          set -euxo pipefail

          # Export runtime env so the validator can find GLD binaries/modules
          export PATH="${INSTALL_PREFIX}/bin:$PATH"
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}:${INSTALL_PREFIX}/lib:${INSTALL_PREFIX}/lib/gridlabd"
          export GLPATH="$(pwd):${INSTALL_PREFIX}:${INSTALL_PREFIX}/bin:${INSTALL_PREFIX}/lib:${INSTALL_PREFIX}/share:$(pwd)/gldcore"

          # If your script lives elsewhere, adjust the path accordingly
          python3 validate_gld.py

      - name: Upload validation artefacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: validate-${{ matrix.name }}
          path: |
            validate.txt
            validate_errors.txt
            gridlabd.xml
          if-no-files-found: ignore

      - name: Run CTest
        if: always()
        working-directory: build
        run: |
          export PATH="${INSTALL_PREFIX}/bin:$PATH"
          export LD_LIBRARY_PATH="${LD_LIBRARY_PATH:-}:${INSTALL_PREFIX}/lib:${INSTALL_PREFIX}/lib/gridlabd"
          export GLPATH="$(pwd)/..:${INSTALL_PREFIX}:${INSTALL_PREFIX}/bin:${INSTALL_PREFIX}/lib:${INSTALL_PREFIX}/share:$(pwd)/../gldcore"
          ctest --verbose --output-on-failure
