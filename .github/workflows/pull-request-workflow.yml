name: GridLAB-D PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/1478
      - develop

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  helics-ref: 'v3.6.1'

jobs:
  linux-build:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
    runs-on: ${{matrix.os}}
    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -yq libboost-dev

      - name: Build HELICS Cache
        id: cache-helics
        uses: actions/cache@v4
        env:
          cache-name: cache-helics
        with:
          path: ~/.cache/HELICS
          key: ${{ matrix.os }}-${{ matrix.arch }}-build-${{ env.cache-name }}-${{ env.helics-ref }}
          restore-keys: ${{ matrix.os }}-${{ matrix.arch }}-build-${{ env.cache-name }}-${{ env.helics-ref }}

      - if: ${{ steps.cache-helics.outputs.cache-hit != 'true' }}
        name: Checkout HELICS
        uses: actions/checkout@v5
        with:
          repository: 'GMLC-TDC/HELICS'
          ref: ${{ env.helics-ref }}
          submodules: 'recursive'
          fetch-depth: 0
          path: helics-build

      - if: ${{ steps.cache-helics.outputs.cache-hit != 'true' }}
        name: Build HELICS
        working-directory: ${{github.workspace}}/helics-build
        run: |
          threads=`nproc`
          cmake -B ${{github.workspace}}/helics-build/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_INSTALL_PREFIX=~/.cache/HELICS -DHELICS_ZMQ_SUBPROJECT=ON
          cmake --build ${{github.workspace}}/helics-build/build --config ${{env.BUILD_TYPE}} --parallel $threads
          cmake --install ${{github.workspace}}/helics-build/build

      - name: Checkout GridLAB-D
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build GridLAB-D
        run: |
          threads=`nproc`
          cmake -B ${{github.workspace}}/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_INSTALL_PREFIX=~/.temp/GridLAB-D -DGLD_USE_HELICS=ON -DGLD_HELICS_DIR=~/.cache/HELICS \
          -DGLD_CI_BUILD=ON
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $threads

      - name: Install GridLAB-D
        working-directory: ${{github.workspace}}/build
        run: cmake --install . --config ${{env.BUILD_TYPE}}

      - name: Run GridLAB-D autotests
        working-directory: ${{github.workspace}}
        run: |
          # Add installed GridLAB-D binaries to PATH
          export PATH=$PATH:~/.temp/GridLAB-D/bin
          # Run integration validation from repository root
          gridlabd -T 0 --validate
          # Future Catch2 unit tests (placeholder):
          # ./build/tests/unit_tests --reporter junit --out unit-tests-linux.xml
          # Current ctest invocation (unit + any ctest-based tests)
          ctest --verbose

  win-build:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg (manifest mode + cache)
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true
          logCollectionRegExps: |
            .*/CMakeOutput\.log$
            .*/CMakeError\.log$
            .*/vcpkg/buildtrees/.+\.log$

      - name: Upload vcpkg & CMake logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-and-cmake-logs
          path: |
            ${{ github.workspace }}/vcpkg/buildtrees/**/*.log
            out/build/ci-windows/**/CMakeOutput.log
            out/build/ci-windows/**/CMakeError.log

      - name: Configure CMake (VS2022 + vcpkg toolchain)
        shell: pwsh
        run: >
          cmake -S . -B out/build/ci-windows
          -G "Visual Studio 17 2022"
          -DCMAKE_CONFIGURATION_TYPES="Debug;Release"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build out/build/ci-windows --config Release

      - name: Run gridlabd --validate
        shell: pwsh
        run: |
          $buildDir = Resolve-Path "out/build/ci-windows"
          $binDir   = Resolve-Path "out/build/ci-windows/bin/Release"
          $shareDir = Resolve-Path "out/build/ci-windows/share"
          $libDir   = Resolve-Path "out/build/ci-windows/lib"
          $gldcore  = Resolve-Path "gldcore"
          $env:GLPATH = "$pwd;$buildDir;$binDir;$libDir;$shareDir;$gldcore"
          $env:PATH   = "$env:PATH;$binDir"
          & "$binDir/gridlabd.exe" --validate

      - name: Run CTest
        shell: pwsh
        working-directory: out/build/ci-windows
        run: ctest -C Release --output-on-failure
          
  mac-build:
    strategy:
      matrix:
        include:
          - os: macos-latest
            arch: x86_64
    runs-on: ${{matrix.os}}
    steps:
      - name: Install Homebrew dependencies
        run: |
          brew update
          env HOMEBREW_NO_AUTO_UPDATE=1 brew install boost

      - name: Build HELICS Cache
        id: cache-helics
        uses: actions/cache@v4
        env:
          cache-name: cache-helics
        with:
          path: ~/.cache/HELICS
          key: ${{ matrix.os }}-${{ matrix.arch }}-build-${{ env.cache-name }}-${{ env.helics-ref }}
          restore-keys: ${{ matrix.os }}-${{ matrix.arch }}-build-${{ env.cache-name }}-${{ env.helics-ref }}

      - if: ${{ steps.cache-helics.outputs.cache-hit != 'true' }}
        name: Checkout HELICS
        uses: actions/checkout@v5
        with:
          repository: 'GMLC-TDC/HELICS'
          ref: ${{ env.helics-ref }}
          submodules: 'recursive'
          fetch-depth: 0
          path: helics-build

      - if: ${{ steps.cache-helics.outputs.cache-hit != 'true' }}
        name: Build HELICS
        working-directory: ${{github.workspace}}/helics-build
        run: |
          threads=`sysctl -n hw.logicalcpu`
          cmake -B ${{github.workspace}}/helics-build/build -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_INSTALL_PREFIX=~/.cache/HELICS -DHELICS_ZMQ_SUBPROJECT=ON \
          -DCMAKE_APPLE_SILICON_PROCESSOR=${{matrix.arch}} -DHELICS_DISABLE_WEBSERVER=ON
          cmake --build ${{github.workspace}}/helics-build/build --config ${{env.BUILD_TYPE}} --parallel $threads
          cmake --install ${{github.workspace}}/helics-build/build

      - name: Checkout GridLAB-D
        uses: actions/checkout@v5
        with:
          submodules: recursive

      - name: Build GridLAB-D
        run: |
          threads=`sysctl -n hw.logicalcpu`
          cmake -B ${{github.workspace}}/build-${{matrix.arch}} -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_INSTALL_PREFIX=~/.temp/GridLAB-D -DGLD_USE_HELICS=ON -DGLD_HELICS_DIR=~/.cache/HELICS \
          -DCMAKE_APPLE_SILICON_PROCESSOR=${{matrix.arch}} -DGLD_CI_BUILD=ON
          cmake --build ${{github.workspace}}/build-${{matrix.arch}} --config ${{env.BUILD_TYPE}} --parallel $threads

      - name: Install GridLAB-D
        working-directory: ${{github.workspace}}/build-${{matrix.arch}}
        run: cmake --install . --config ${{env.BUILD_TYPE}}

      - name: Run GridLAB-D autotests
        working-directory: ${{github.workspace}}
        run: |
          export PATH=$PATH:~/.temp/GridLAB-D/bin
          gridlabd -T 0 --validate
          # Future Catch2 unit tests (placeholder):
          # ./build-${{matrix.arch}}/tests/unit_tests --reporter junit --out unit-tests-macos.xml
          ctest --verbose
