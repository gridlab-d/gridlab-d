name: GridLAB-D PR Validation

on:
  workflow_dispatch:
  pull_request:
    branches:
      - feature/1478
      - develop

env:
  # Customize the CMake build type here (Release, Debug, RelWithDebInfo, etc.)
  BUILD_TYPE: Release
  helics-ref: "v3.6.1"

jobs:
  linux-build-and-validate:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            arch: x86_64
    runs-on: ${{matrix.os}}
    steps:
      - name: Install Dependencies
        run: |
          sudo apt update
          sudo apt install -yq --no-install-recommends \
            build-essential \
            cmake \
            ninja-build \
            libboost-dev \
            libeigen3-dev \
            nlohmann-json3-dev

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Build HELICS Cache
        id: cache-helics
        uses: actions/cache@v5
        env:
          cache-name: cache-helics
        with:
          path: ~/.cache/HELICS
          key: ${{ matrix.os }}-${{ matrix.arch }}-build-${{ env.cache-name }}-${{ env.helics-ref }}
          restore-keys: ${{ matrix.os }}-${{ matrix.arch }}-build-${{ env.cache-name }}-${{ env.helics-ref }}

      - if: ${{ steps.cache-helics.outputs.cache-hit != 'true' }}
        name: Checkout HELICS
        uses: actions/checkout@v6
        with:
          repository: "GMLC-TDC/HELICS"
          ref: ${{ env.helics-ref }}
          submodules: "recursive"
          fetch-depth: 0
          path: helics-build

      - if: ${{ steps.cache-helics.outputs.cache-hit != 'true' }}
        name: Build HELICS
        working-directory: ${{github.workspace}}/helics-build
        run: |
          threads=`nproc`
          cmake -B ${{github.workspace}}/helics-build/build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_INSTALL_PREFIX=~/.cache/HELICS \
          -DHELICS_ZMQ_SUBPROJECT=ON
          cmake --build ${{github.workspace}}/helics-build/build --config ${{env.BUILD_TYPE}} --parallel $threads
          cmake --install ${{github.workspace}}/helics-build/build

      - name: Checkout GridLAB-D
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Build GridLAB-D
        run: |
          threads=`nproc`
          cmake -S . -B ${{github.workspace}}/build \
          -G Ninja \
          -DCMAKE_BUILD_TYPE=${{env.BUILD_TYPE}} \
          -DCMAKE_INSTALL_PREFIX=~/.temp/GridLAB-D \
          -DGLD_USE_HELICS=ON \
          -DGLD_HELICS_DIR=~/.cache/HELICS \
          -DGLD_CI_BUILD=ON
          cmake --build ${{github.workspace}}/build --config ${{env.BUILD_TYPE}} --parallel $threads

      - name: Install GridLAB-D
        working-directory: ${{github.workspace}}/build
        run: cmake --install . --config ${{env.BUILD_TYPE}}

      - name: Run GridLAB-D autotests
        working-directory: ${{github.workspace}}
        run: |
          # Add installed GridLAB-D binaries to PATH
          export PATH=$PATH:~/.temp/GridLAB-D/bin
          # Run integration validation from repository root
          python validate_gld.py -T 0

      - name: Upload validation artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-${{ matrix.name }}
          path: |
            validate.txt
          if-no-files-found: ignore

  win-build-and-validate:
    runs-on: windows-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg (manifest mode + cache)
        uses: lukka/run-vcpkg@v11
        with:
          runVcpkgInstall: true
          logCollectionRegExps: |
            .*/CMakeOutput\.log$
            .*/CMakeError\.log$
            .*/vcpkg/buildtrees/.+\.log$

      - name: Clean install prefix (Windows)
        shell: pwsh
        run: |
          $installRoot = "$env:USERPROFILE\.temp\GridLAB-D"
          if (Test-Path $installRoot) {
            Write-Host "Removing previous install at $installRoot..."
            Remove-Item -Path $installRoot -Recurse -Force -ErrorAction SilentlyContinue
          }

      - name: Configure CMake (VS2022 + vcpkg toolchain)
        shell: pwsh
        run: >
          cmake -S .
          --log-level=VERBOSE
          --log-context
          --debug-output
          -B out/build/ci-windows
          -G "Visual Studio 17 2022"
          -A x64
          -DCMAKE_CONFIGURATION_TYPES="Debug;Release"
          -DVCPKG_TARGET_TRIPLET=x64-windows
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"
          "-DCMAKE_INSTALL_PREFIX=$env:USERPROFILE/.temp/GridLAB-D"
          -DGLD_CI_BUILD=ON

      - name: Build GridLAB-D (Release)
        shell: pwsh
        run: cmake --build out/build/ci-windows --config Release -t ALL_BUILD
        env:
          CFLAGS: "/W0"
          CXXFLAGS: "/W0"

      - name: Install GridLAB-D (Release)
        shell: pwsh
        run: cmake --install out/build/ci-windows --config Release --verbose

      # Python-based validation
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run Python GridLAB-D validator (Windows) (JSON)
        shell: pwsh
        run: |
          $prefix = "$env:USERPROFILE\.temp\GridLAB-D"
          $bin    = Join-Path $prefix "bin"
          $lib    = Join-Path $prefix "lib"
          $share  = Join-Path $prefix "share"
          $gldcore= Join-Path $pwd "gldcore"

          # Ensure the validator sees GLD binaries and modules
          $env:PATH   = "$env:PATH;$bin"
          $env:GLPATH = "$pwd;$prefix;$bin;$lib;$share;$gldcore"

          python validate_gld.py -T 0

      - name: Upload validation artefacts (Windows)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-windows
          path: |
            validate.txt
          if-no-files-found: ignore

  # ─────────────────────────────────────────────
  # macOS: AppleClang + Homebrew + Python validator
  # ─────────────────────────────────────────────
  macos-build-and-validate:
    runs-on: macos-latest # ARM64 macOS runner
    timeout-minutes: 600

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Homebrew (optional)
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/Brewfile') }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build tools and Eigen via Homebrew
        shell: bash
        run: |
          set -euxo pipefail

          if ! command -v brew >/dev/null 2>&1; then
            echo "Homebrew not found"; exit 1
          fi

          brew update

          if [[ -f ci/Brewfile ]]; then
            brew bundle --file=ci/Brewfile
          else
            brew install cmake ninja pkg-config eigen
          fi

          HOMEBREW_PREFIX="$(brew --prefix)"
          echo "HOMEBREW_PREFIX=${HOMEBREW_PREFIX}"

          # Help CMake find Homebrew-installed packages
          export PKG_CONFIG_PATH="${HOMEBREW_PREFIX}/lib/pkgconfig:${HOMEBREW_PREFIX}/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "CMAKE_PREFIX_PATH=${HOMEBREW_PREFIX}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}"   >> "$GITHUB_ENV"

      - name: Print toolchain info
        run: |
          sw_vers
          clang --version
          cmake --version
          ninja --version
          brew list --versions cmake ninja pkg-config eigen

      - name: Clean build
        run: |
          rm -rf build/ out/ CMakeCache.txt CMakeFiles 2>/dev/null || true

      - name: Configure CMake (AppleClang + Ninja)
        shell: bash
        env:
          CMAKE_PREFIX_PATH: ${{ env.CMAKE_PREFIX_PATH }}
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
        run: |
          set -euxo pipefail
          BUILD_DIR="out/build/ci-macos"

          cmake -S . -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
            -DCMAKE_MACOSX_RPATH=ON \
            -DCMAKE_INSTALL_RPATH="$HOME/.temp/GridLAB-D/lib;$HOME/.temp/GridLAB-D/lib/gridlabd"

      - name: Build (Release)
        shell: bash
        run: cmake --build out/build/ci-macos -- -v

      - name: Install (Release)
        shell: bash
        run: cmake --install out/build/ci-macos --prefix "$HOME/.temp/GridLAB-D" --verbose

      # Python-based validation
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run Python GridLAB-D validator (macOS)(JSON)
        shell: bash
        run: |
          set -euxo pipefail
          PREFIX="$HOME/.temp/GridLAB-D"
          BIN_DIR="$PREFIX/bin"
          LIB_DIR="$PREFIX/lib"
          SHARE_DIR="$PREFIX/share"
          GLDCORE_DIR="$(pwd)/gldcore"

          export DYLD_LIBRARY_PATH="${LIB_DIR}:${LIB_DIR}/gridlabd:${DYLD_LIBRARY_PATH:-}"
          export GLPATH="$(pwd):${PREFIX}:${BIN_DIR}:${LIB_DIR}:${SHARE_DIR}:${GLDCORE_DIR}"
          export PATH="${PATH}:${BIN_DIR}"

          python validate_gld.py -T 0

      - name: Upload validation artefacts (macOS)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-macos
          path: |
            validate.txt
          if-no-files-found: ignore
  # ─────────────────────────────────────────────
  # macOS (ARM64) with Homebrew GCC + Python validator
  # ─────────────────────────────────────────────
  mac-arm64-gcc:
    runs-on: macos-latest # Apple Silicon runner (ARM64)
    timeout-minutes: 600

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Cache Homebrew (optional)
        uses: actions/cache@v5
        with:
          path: |
            ~/Library/Caches/Homebrew
            /Library/Caches/Homebrew
          key: brew-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('ci/Brewfile') }}
          restore-keys: |
            brew-${{ runner.os }}-${{ runner.arch }}-

      - name: Install build tools via Homebrew (incl. GCC)
        shell: bash
        run: |
          set -euxo pipefail
          brew update

          if [[ -f ci/Brewfile ]]; then
            # Ensure Brewfile contains: gcc, cmake, ninja, pkg-config, eigen
            grep -q '^brew "gcc"$' ci/Brewfile || echo 'brew "gcc"' >> ci/Brewfile
            grep -q '^brew "cmake"$' ci/Brewfile || echo 'brew "cmake"' >> ci/Brewfile
            grep -q '^brew "ninja"$' ci/Brewfile || echo 'brew "ninja"' >> ci/Brewfile
            grep -q '^brew "pkg-config"$' ci/Brewfile || echo 'brew "pkg-config"' >> ci/Brewfile
            grep -q '^brew "eigen"$' ci/Brewfile || echo 'brew "eigen"' >> ci/Brewfile
            brew bundle --file=ci/Brewfile
          else
            brew install gcc cmake ninja pkg-config eigen
          fi

          HOMEBREW_PREFIX="$(brew --prefix)"
          echo "HOMEBREW_PREFIX=${HOMEBREW_PREFIX}"

          # Help CMake find Homebrew-installed packages
          export PKG_CONFIG_PATH="${HOMEBREW_PREFIX}/lib/pkgconfig:${HOMEBREW_PREFIX}/share/pkgconfig:${PKG_CONFIG_PATH:-}"
          echo "CMAKE_PREFIX_PATH=${HOMEBREW_PREFIX}" >> "$GITHUB_ENV"
          echo "PKG_CONFIG_PATH=${PKG_CONFIG_PATH}"   >> "$GITHUB_ENV"

      - name: Detect GCC toolchain (major version)
        id: gcc
        shell: bash
        run: |
          set -euxo pipefail
          # Try common Homebrew gcc suffixes from newest to older
          for v in 15 14 13 12 11; do
            if command -v "gcc-${v}" >/dev/null 2>&1 && command -v "g++-${v}" >/dev/null 2>&1; then
              echo "found gcc-${v}"
              echo "major=${v}" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          echo "No suffixed gcc found; falling back to default gcc/g++"
          echo "major=default" >> "$GITHUB_OUTPUT"

      - name: Print toolchain info
        shell: bash
        run: |
          set -euxo pipefail
          sw_vers
          clang --version || true
          cmake --version
          ninja --version
          brew list --versions gcc cmake ninja pkg-config eigen
          if [[ "${{ steps.gcc.outputs.major }}" != "default" ]]; then
            "gcc-${{ steps.gcc.outputs.major }}" --version | head -1
            "g++-${{ steps.gcc.outputs.major }}" --version | head -1
          else
            gcc --version | head -1
            g++ --version | head -1
          fi

      - name: Clean build
        shell: bash
        run: |
          set -euxo pipefail
          rm -rf build/ out/ CMakeCache.txt CMakeFiles 2>/dev/null || true

      - name: Configure CMake (GNU GCC + Ninja)
        shell: bash
        env:
          CMAKE_PREFIX_PATH: ${{ env.CMAKE_PREFIX_PATH }}
          PKG_CONFIG_PATH: ${{ env.PKG_CONFIG_PATH }}
        run: |
          set -euxo pipefail
          BUILD_DIR="out/build/ci-macos-gcc"
          PREFIX_DIR="$HOME/.temp/GridLAB-D"

          if [[ "${{ steps.gcc.outputs.major }}" != "default" ]]; then
            export CC="gcc-${{ steps.gcc.outputs.major }}"
            export CXX="g++-${{ steps.gcc.outputs.major }}"
          else
            export CC="gcc"
            export CXX="g++"
          fi

          cmake -S . -B "$BUILD_DIR" \
            -G Ninja \
            -DCMAKE_OSX_ARCHITECTURES=arm64 \
            -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0 \
            -DCMAKE_BUILD_TYPE="Release" \
            -DCMAKE_PREFIX_PATH="${CMAKE_PREFIX_PATH}" \
            -DCMAKE_MACOSX_RPATH=ON \
            -DCMAKE_INSTALL_RPATH="$PREFIX_DIR/lib;$PREFIX_DIR/lib/gridlabd" \
            -DCMAKE_C_COMPILER="${CC}" \
            -DCMAKE_CXX_COMPILER="${CXX}" \
            -DGLD_CI_BUILD=ON

      - name: Build (Release)
        shell: bash
        run: cmake --build out/build/ci-macos-gcc -- -v

      - name: Install (Release)
        shell: bash
        run: cmake --install out/build/ci-macos-gcc --prefix "$HOME/.temp/GridLAB-D" --verbose

      # Python-based validation
      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Run Python GridLAB-D validator (macOS GCC)(JSON)
        shell: bash
        run: |
          set -euxo pipefail
          PREFIX="$HOME/.temp/GridLAB-D"
          BIN_DIR="$PREFIX/bin"
          LIB_DIR="$PREFIX/lib"
          SHARE_DIR="$PREFIX/share"
          GLDCORE_DIR="$(pwd)/gldcore"
          HB_PREFIX="$(brew --prefix)"
          GCC_OPT_DIR="${HB_PREFIX}/opt/gcc"

          GCC_LIB_CANDIDATES=()
          if [[ -d "${GCC_OPT_DIR}/lib/gcc" ]]; then
            GCC_LIB_CANDIDATES+=("${GCC_OPT_DIR}/lib/gcc")
            vdir="$(ls -1d ${GCC_OPT_DIR}/lib/gcc/* 2>/dev/null | sort -V | tail -1 || true)"
            [[ -n "$vdir" ]] && GCC_LIB_CANDIDATES+=("$vdir")
          fi

          export DYLD_LIBRARY_PATH="$(IFS=:; echo "${LIB_DIR}:${LIB_DIR}/gridlabd:${GCC_LIB_CANDIDATES[*]}:${DYLD_LIBRARY_PATH:-}")"
          export GLPATH="$(pwd):${PREFIX}:${BIN_DIR}:${LIB_DIR}:${SHARE_DIR}:${GLDCORE_DIR}"
          export PATH="${PATH}:${BIN_DIR}"

          python -u validate_gld.py

      - name: Upload validation artefacts (macOS GCC)
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: validate-mac-arm64-gcc
          path: |
            validate.txt
            validate_errors.txt
            gridlabd.xml
          if-no-files-found: ignore
