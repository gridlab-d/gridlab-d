
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:   # 👈 enables "Run workflow" button in Actions tab
    inputs:
      config:
        description: 'CMake build config'
        required: false
        default: 'Release'

jobs:
  # ------------------------------
  # Windows: Visual Studio 2022 + vcpkg manifest mode
  # ------------------------------
  build-and-validate-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup vcpkg (manifest mode + cache)
        uses: lukka/run-vcpkg@v11 
        with:
          runVcpkgInstall: true
          vcpkgDirectory: '${{ github.workspace }}'
          logCollectionRegExps: |                
            .*/CMakeOutput\.log$
            .*/CMakeError\.log$
            .*/vcpkg/buildtrees/.+\.log$
      
      - name: Discover vcpkg & CMake logs (on failure)
        if: failure()
        shell: pwsh
        run: |
          Write-Host "Workspace: $pwd"
          Write-Host "Searching for vcpkg buildtrees logs..."
          Get-ChildItem -Path $pwd -Recurse -Filter *.log |
            Where-Object { $_.FullName -match '\\vcpkg\\buildtrees\\' } |
            Select-Object FullName
          Write-Host "Searching for CMakeOutput.log / CMakeError.log..."
          Get-ChildItem -Path $pwd -Recurse -Include CMakeOutput.log,CMakeError.log |
            Select-Object FullName

      - name: vcpkg version & env (on failure)
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Attempting to locate vcpkg.exe..."
          Get-ChildItem -Path $pwd -Recurse -Filter vcpkg.exe | Select-Object FullName
          Write-Host "Print vcpkg version if found:"
          $vcpkg = Get-ChildItem -Path $pwd -Recurse -Filter vcpkg.exe | Select-Object -First 1
          if ($vcpkg) { & $vcpkg.FullName version }
          Write-Host "Environment:"

      - name: Diagnose vcpkg bootstrap failure (on failure)
        if: failure()
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Continue'
          Write-Host "Workspace: $pwd"

          Write-Host "Locate vcpkg.exe under workspace:"
          Get-ChildItem -Path $pwd -Recurse -Filter vcpkg.exe | Select-Object FullName

          Write-Host "Show any vcpkg buildtrees logs under workspace:"
          Get-ChildItem -Path $pwd -Recurse -Filter *.log |
            Where-Object { $_.FullName -match '\\vcpkg\\buildtrees\\' } |
            Select-Object FullName

      - name: Upload vcpkg & CMake logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vcpkg-and-cmake-logs
          path: |
            ${{ github.workspace }}/vcpkg/buildtrees/**/*.log
            out/build/ci-windows/**/CMakeOutput.log
            out/build/ci-windows/**/CMakeError.log

            - name: Configure CMake (VS2022 + vcpkg toolchain)
              shell: pwsh
              run: >
                cmake -S . -B out/build/ci-windows
                -G "Visual Studio 17 2022"
                -DCMAKE_CONFIGURATION_TYPES="Debug;Release"
                -DVCPKG_TARGET_TRIPLET=x64-windows
                -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake"

      - name: Build (Release)
        shell: pwsh
        run: cmake --build out/build/ci-windows --config Release

      - name: Run gridlabd --validate
        shell: pwsh
        run: |
          $buildDir = Resolve-Path "out/build/ci-windows"
          $binDir   = Resolve-Path "out/build/ci-windows/bin/Release"
          $shareDir = Resolve-Path "out/build/ci-windows/share"
          $libDir   = Resolve-Path "out/build/ci-windows/lib"
          $gldcore  = Resolve-Path "gldcore"

          if (-not (Test-Path "$binDir/gridlabd.exe")) {
            Write-Error "gridlabd.exe not found in $binDir"
            Get-ChildItem -Recurse "out/build/ci-windows" | Select-Object FullName
            exit 1
          }

          # Windows uses ';' as path separator
          $env:GLPATH = "$pwd;$buildDir;$binDir;$libDir;$shareDir;$gldcore"
          $env:PATH   = "$env:PATH;$binDir"

          & "$binDir/gridlabd.exe" --validate

      - name: (Optional) Run CTest
        shell: pwsh
        working-directory: out/build/ci-windows
        run: ctest -C Release --output-on-failure

      - name: Upload artifact (gridlabd Windows Release)
        uses: actions/upload-artifact@v4
        with:
          name: gridlabd-windows-release
          path: |
            out/build/ci-windows/bin/Release/*
            out/build/ci-windows/share/**
            out/build/ci-windows/lib/**

  