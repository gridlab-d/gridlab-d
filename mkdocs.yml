site_name: GridLAB-D Documentation
theme:
  name: readthedocs
  highlightjs: true
  display_version: false
  style_external_links: true
  logo: images/GridLAB-D_WhiteVersion.png
  user_color_mode_toggle:  true
  navigation_depth: 6
  icon:
    admonition:
      note: octicons/tag-16
      abstract: octicons/checklist-16
      info: octicons/info-16
      tip: octicons/squirrel-16
      success: octicons/check-16
      question: octicons/question-16
      warning: octicons/alert-16
      failure: octicons/x-circle-16
      danger: octicons/zap-16
      bug: octicons/bug-16
      example: octicons/beaker-16
      quote: octicons/quote-16
extra_css:
  - _static/css/custom.css
plugins:
  - search
  - caption
  - mermaid2
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: sphinx
            show_source: false
            show_signature: true
            show_signature_annotations: true
            annotations_path: source   # put types in the signature
            separate_signature: true
  - mkdoxy:
      doxygen-bin-path:
      projects:
       gridlabd:
          src-dirs: assert autotest build climate comm commercial connection control debug generators gldcore GldEditor market matlab matpower mysql network optimize plc powerflow python reliability residential rest tape tape_file tape_memory tape_plot utilities
          full-doc: True 
          doxy-cfg: 
            FILE_PATTERNS: "*.cpp *.h*" 
            RECURSIVE: True 
            WARN_IF_UNDOCUMENTED: True
            WARN_IF_DOC_ERROR: True
            WARN_NO_PARAMDOC: True
            WARN_AS_ERROR: False
            WARN_LOGFILE: docs/doxygen-warnings.log
markdown_extensions:
  - fenced_code
  - codehilite:
      guess_lang: false
  - pymdownx.arithmatex:
      generic: true
  - markdown_include.include:
      base_path: docs/
  - admonition
  - pymdownx.details
  - attr_list
extra_javascript:
  - javascripts/mathjax.js
  - https://unpkg.com/mathjax@3/es5/tex-mml-chtml.js
