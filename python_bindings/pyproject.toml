[build-system]
requires = ["scikit-build-core >=0.8", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "gridlabd"
version = "1.0.9"
description = "Python bindings for GridLAB-D power system simulation"
readme = "README.md"
license = {text = "Battelle Open Source License"}
authors = [{name = "GridLAB-D Team", email = "gridlabd@pnnl.gov"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.19.0",
]

[project.urls]
Homepage = "https://github.com/gridlab-d/gridlab-d"
Repository = "https://github.com/gridlab-d/gridlab-d"
Documentation = "https://gridlab-d.shoutwiki.com/wiki/Main_Page"

[tool.scikit-build]
wheel.expand-macos-universal-tags = true
cmake.version = ">=3.15"
cmake.build-type = "Release"
wheel.packages = ["src/gridlabd"]
sdist.include = [
    "CMakeLists.txt", 
    "src_cpp/*", 
    "src/**",
    "prebuilt/**"
]
sdist.exclude = [".git*", "*.pyc", "__pycache__", "build", "dist", ".venv"]


[tool.cibuildwheel]
# Build for Python 3.9 through 3.12
build = ["cp39-*", "cp310-*", "cp311-*", "cp312-*"]

# Skip 32-bit, Windows, and musl Linux builds
skip = ["*-win*", "*-manylinux_i686", "*-musllinux_*"]

# Test command to verify the wheel works
test-command = "python -c 'import gridlabd; print(gridlabd.version()); print(gridlabd.hello())'"

[tool.cibuildwheel.linux]
# Install build dependencies
before-all = "yum install -y cmake3 patchelf || apt-get update && apt-get install -y cmake patchelf"

# Use manylinux_2_28 (compatible with Ubuntu 20.04+, glibc 2.28+)
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"

[tool.cibuildwheel.macos]
# Install CMake on macOS
before-all = "brew install cmake"

# Target macOS 11.0+ (Big Sur and later)
environment = { MACOSX_DEPLOYMENT_TARGET = "11.0" }
