[build-system]
requires = ["scikit-build-core >=0.4.3", "nanobind >=1.3.2"]
build-backend = "scikit_build_core.build"

[project]
name = "gridlabd"
version = "5.0.0"
description = "Python bindings for GridLAB-D power system simulation"
readme = "README.md"
license = {text = "Battelle Open Source License"}
authors = [{name = "GridLAB-D Team", email = "gridlabd@pnnl.gov"}]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: BSD License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.8",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering",
]
requires-python = ">=3.8"
dependencies = [
    "numpy>=1.19.0",
]

[project.urls]
Homepage = "https://github.com/gridlab-d/gridlab-d"
Repository = "https://github.com/gridlab-d/gridlab-d"
Documentation = "https://gridlab-d.shoutwiki.com/wiki/Main_Page"

[tool.scikit-build]
wheel.expand-macos-universal-tags = true
cmake.minimum-version = "3.15"
cmake.build-type = "Release"
